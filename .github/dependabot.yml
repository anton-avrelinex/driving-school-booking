version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /
      - /apps/main-service
      - /apps/observability-service
      - /apps/web-client
      - /packages/eslint-config
      - /packages/nestjs-auth
      - /packages/nestjs-logger
      - /packages/shared-types
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "@typescript-eslint/*"]
      nestjs:
        patterns: ["@nestjs/*"]
      vue:
        patterns: ["vue", "vue-*", "@vue/*", "@vitejs/*", "vite", "vitest"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
